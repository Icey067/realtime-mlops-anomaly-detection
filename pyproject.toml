[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-mlops-anomaly"
version = "1.0.0"
description = "Streaming transaction anomaly detection with a quantized autoencoder"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "redis>=5.0.3,<6.0.0",
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "torch>=2.2.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0",
    "mlflow>=2.13.0",
    "prometheus-client>=0.20.0",
    "locust>=2.28.0",
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"demo.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
