services:
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--tcp-backlog", "511"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - sentinel-net

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: sentinel-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - CORS_ALLOW_ORIGINS=["http://localhost:3000"]
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - sentinel-net

  producer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: sentinel-producer
    command: ["python", "-m", "src.ingestion.producer", "--drift-interval", "20"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PRODUCER_BATCH_SIZE=50
      - PRODUCER_EMIT_INTERVAL_SEC=0.05
    volumes:
      - ../data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentinel-net

  consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: sentinel-consumer
    command: ["python", "-m", "src.ingestion.consumer"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CONSUMER_BATCH_SIZE=100
      - LATENCY_BUDGET_MS=10.0
    volumes:
      - ../data:/app/data:ro
      - ../models:/app/models
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentinel-net

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: sentinel-mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlruns
    volumes:
      - ../mlruns:/mlruns
    restart: unless-stopped
    networks:
      - sentinel-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: sentinel-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - sentinel-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: sentinel-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge
