name: Sentinel MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    name: Model Validation & System Test Suite
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install ruff onnxscript

      - name: Lint
        run: |
          ruff check src tests demo.py benchmarks

      - name: Verify schemas and configuration
        run: |
          pytest tests/test_schemas.py -v

      - name: Train Autoencoder & Calibrate Threshold
        run: |
          python -m src.model.train --epochs 5 --batch-size 256

      - name: Export and Quantize to ONNX INT8
        run: |
          python -m src.model.quantize

      - name: Test predictor and API
        run: |
          pytest tests/test_predictor.py tests/test_api.py -v
